name: regen-check

# The journals/ directory is the public source of every page. If the pages
# ever drift from what the journals compile to, the evidence contract is
# broken — fail loudly instead of letting a hand-edit slip in.

on:
  push:
    branches: [main]
    paths:
      - "harnesses/**"
      - "matrix.md"
      - "matrix.yaml"
      - "journals/**"
      - "scripts/generate.py"
      - "scripts/build_site.py"
      - "docs/**"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - "harnesses/**"
      - "matrix.md"
      - "matrix.yaml"
      - "journals/**"
      - "scripts/generate.py"
      - "scripts/build_site.py"
      - "docs/**"
      - "CHANGELOG.md"

permissions:
  contents: read

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate from public journals
        run: |
          mkdir -p /tmp/regen
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import importlib.util
          spec = importlib.util.spec_from_file_location("gen", "scripts/generate.py")
          gen = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(gen)
          # generate.py sorts by the wave order MANIFEST.md declares, so the
          # glob is safe — do NOT re-hardcode the list here, it rots every wave
          journals = sorted(str(p) for p in Path("journals").glob("*.jsonl"))
          gen.main(journals, Path("/tmp/regen"),
                   manifest=Path("journals/MANIFEST.md"))
          PY

      - name: diff pages against regenerated output
        run: |
          fail=0
          for f in harnesses/*.md matrix.md matrix.yaml matrix.csv; do
            if ! diff -q "$f" "/tmp/regen/$f" >/dev/null; then
              echo "::error file=$f::page drifted from journals/ — regenerate or fix the journal"
              diff "$f" "/tmp/regen/$f" | head -20
              fail=1
            fi
          done
          extra=$(cd /tmp/regen/harnesses && ls | sed 's/\.md$//' | sort > /tmp/r.txt; cd "$GITHUB_WORKSPACE/harnesses" && ls | sed 's/\.md$//' | sort > /tmp/c.txt; comm -3 /tmp/c.txt /tmp/r.txt)
          if [ -n "$extra" ]; then
            echo "::error::harness set differs between pages and journals: $extra"
            fail=1
          fi
          exit $fail

      - name: site must equal a fresh build from the committed pages
        run: |
          # docs/ is committed build output: build_site.py reads matrix.yaml +
          # harnesses/*.md + CHANGELOG.md. Combined with the step above, this
          # closes the chain site == pages == journals — a data fix that forgets
          # the site rebuild now fails here instead of shipping a stale grid.
          python3 scripts/build_site.py
          if ! git diff --quiet docs/; then
            echo "::error file=docs/::site drifted from the committed pages — run scripts/build_site.py and commit docs/"
            git diff --stat docs/
            exit 1
          fi
