<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="harness-atlas — what AI coding harnesses promise and support, pinned and evidenced">
  <style>
    .draw { animation: draw 2.4s cubic-bezier(.4,0,.2,1) .4s both; }
    .scan { animation: sweep 6s linear 2.6s infinite; }
    .cell { animation: pulse 4s ease-in-out infinite; }
    @keyframes draw { from { stroke-dashoffset: 1; } }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1080px); } }
    @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw, .scan, .cell { animation: none; } }
  </style>

  <rect width="1200" height="340" fill="#0b0806"/>

  <text x="60" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="56" font-weight="700" fill="#F8F5F2">harness-atlas</text>
  <text x="60" y="128" font-family="ui-monospace, Menlo, monospace" font-size="17" letter-spacing="1.5" fill="#FE9106">what AI coding harnesses promise — and support — pinned &amp; evidenced</text>
  <rect x="60" y="142" width="110" height="3" fill="#FE9106"/>

  <!-- matrix grid: rows = harnesses, cols = capabilities; cells light up in a wave -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6e5c50">
    <text x="60" y="190">claude-code</text>
    <text x="60" y="222">opencode</text>
    <text x="60" y="254">codex-cli</text>
    <text x="60" y="286">aider</text>
  </g>
  <g>
    <rect class="cell" x="200" y="178" width="26" height="16" fill="#FE9106"/>
    <rect class="cell" x="234" y="178" width="26" height="16" fill="#FE9106" style="animation-delay:.3s"/>
    <rect class="cell" x="268" y="178" width="26" height="16" fill="#FEAF12" style="animation-delay:.6s"/>
    <rect class="cell" x="302" y="178" width="26" height="16" fill="#FE9106" style="animation-delay:.9s"/>
    <rect class="cell" x="336" y="178" width="26" height="16" fill="#FE7007" style="animation-delay:1.2s"/>
    <rect class="cell" x="370" y="178" width="26" height="16" fill="#FE9106" style="animation-delay:1.5s"/>

    <rect class="cell" x="200" y="210" width="26" height="16" fill="#FE9106" style="animation-delay:.2s"/>
    <rect class="cell" x="234" y="210" width="26" height="16" fill="#5c4c3f" style="animation-delay:.5s"/>
    <rect class="cell" x="268" y="210" width="26" height="16" fill="#FE9106" style="animation-delay:.8s"/>
    <rect class="cell" x="302" y="210" width="26" height="16" fill="#FEAF12" style="animation-delay:1.1s"/>
    <rect class="cell" x="336" y="210" width="26" height="16" fill="#FE9106" style="animation-delay:1.4s"/>
    <rect class="cell" x="370" y="210" width="26" height="16" fill="#5c4c3f" style="animation-delay:1.7s"/>

    <rect class="cell" x="200" y="242" width="26" height="16" fill="#FEAF12" style="animation-delay:.4s"/>
    <rect class="cell" x="234" y="242" width="26" height="16" fill="#FE9106" style="animation-delay:.7s"/>
    <rect class="cell" x="268" y="242" width="26" height="16" fill="#FE9106" style="animation-delay:1s"/>
    <rect class="cell" x="302" y="242" width="26" height="16" fill="#5c4c3f" style="animation-delay:1.3s"/>
    <rect class="cell" x="336" y="242" width="26" height="16" fill="#FE7007" style="animation-delay:1.6s"/>
    <rect class="cell" x="370" y="242" width="26" height="16" fill="#FE9106" style="animation-delay:1.9s"/>

    <rect class="cell" x="200" y="274" width="26" height="16" fill="#5c4c3f" style="animation-delay:.6s"/>
    <rect class="cell" x="234" y="274" width="26" height="16" fill="#5c4c3f" style="animation-delay:.9s"/>
    <rect class="cell" x="268" y="274" width="26" height="16" fill="#FE9106" style="animation-delay:1.2s"/>
    <rect class="cell" x="302" y="274" width="26" height="16" fill="#5c4c3f" style="animation-delay:1.5s"/>
    <rect class="cell" x="336" y="274" width="26" height="16" fill="#FE9106" style="animation-delay:1.8s"/>
    <rect class="cell" x="370" y="274" width="26" height="16" fill="#5c4c3f" style="animation-delay:2.1s"/>
  </g>

  <!-- evidence line drawing itself: docs -> pin -> cell -->
  <path class="draw" pathLength="1" stroke-dasharray="1" stroke-dashoffset="0"
        d="M460 240 L600 240 L640 200 L700 200 L740 260 L860 260 L900 220 L1080 220"
        fill="none" stroke="#FE7007" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#b7a496">
    <text x="460" y="262">docs</text>
    <text x="640" y="188">version pin</text>
    <text x="740" y="282">evidence quote</text>
    <text x="900" y="208">cell</text>
  </g>
  <g class="scan"><rect x="60" y="168" width="2" height="130" fill="#FE7007" opacity=".4"/></g>

  <text x="60" y="326" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#6e5c50">20 harnesses · 14 capabilities · every cell cites a fetched doc · as of 2026-10-05</text>
</svg>
